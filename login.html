<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/login.css">
    <title>Login</title>
</head>
<body>
    <section>

        <p id="mensagem"></p>

        <form id="formLogin">
            <h3>Login</h3>

            <div class="camp">
                <p>Nome</p>
            <input 
            
            type="text" 
            id="Nome"
            required
            min="0"
            max="10"
            placeholder="Nome"
            >

            <p>E-mail</p>
            <input 
            
            type="email" 
            id="email"
            required
            min="0"
            placeholder="E-mail"
            >

            <p>Senha</p>
            <input 
            
            type="password" 
            id="password"
            required
            min="0"
            max="100"
            placeholder="Digite uma senha forte"
            >
            </div>

            <div class="acoes">
                <button href="index.html" type="submit">
                    Enviar
                </button>
            </div>
        </form>
    </section>

    <script src="login.js"></script>
</body>
</html>
